}

android {
    namespace 'org.saturday.emulator'
    compileSdk 35

    defaultConfig {
        applicationId 'org.saturday.emulator'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }
}

dependencies {
    implementation files('libs/saturday.aar')
}
