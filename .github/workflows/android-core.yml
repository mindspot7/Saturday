name: Android core compile

on:
  push:
    branches: [main, android-port]
  pull_request:
    branches: [main, android-port]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-android-core:
    name: Compile emulator core for Android arm64
    runs-on: ubuntu-latest
    env:
      ANDROID_NDK_VERSION: 27.2.12479018
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Use the SDK preinstalled on GitHub's Ubuntu runner. setup-android
      # currently attempts to install the removed legacy "tools" package.
      - name: Install Android NDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" --install "ndk;${ANDROID_NDK_VERSION}"

      # purego uses cgo's dynamic-loader bridge on Android, so CGO_ENABLED=0
      # is not a valid Android smoke test for this dependency graph. Use the
      # NDK's target compiler to check the actual Android ARM64 build path.
      - name: Compile core and adapter for Android arm64
        env:
          GOOS: android
          GOARCH: arm64
          CGO_ENABLED: '1'
        run: |
          export CC="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          test -x "$CC"
          go build ./core ./adapter
